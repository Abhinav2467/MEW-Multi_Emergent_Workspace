<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MEW Autofill Inspector</title>
  <style>
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; box-sizing: border-box; }
    h2 { font-size: 16px; color: #38bdf8; margin: 0 0 12px 0; }
    .status-card { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; line-height: 1.5; }
    .status-online { color: #4ade80; font-weight: bold; }
    .status-offline { color: #f87171; font-weight: bold; }
    .field-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #475569; background: #020617; color: #38bdf8; font-family: monospace; font-size: 11px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-primary { background: #38bdf8; color: #0f172a; margin-top: 6px; }
    .btn-secondary { background: #334155; color: #f8fafc; margin-top: 8px; }
    .btn-sync { background: #0284c7; color: #ffffff; margin-top: 6px; }
    .cache-details { background: #020617; border: 1px solid #1e293b; padding: 8px; border-radius: 4px; margin-top: 6px; font-size: 11px; color: #94a3b8; max-height: 120px; overflow-y: auto; }
    .cache-details b { color: #38bdf8; }
  </style>
</head>
<body>
  <h2>✨ Project MEW — Autofill Inspector</h2>
  
  <div class="status-card">
    Backend Status: <span id="backend-status" class="status-offline">Checking...</span><br>
    <small id="user-info" style="color: #94a3b8; display: block; margin-top: 4px;">Candidate: Not Synced</small>
  </div>

  <div class="status-card">
    💾 <b>Browser Memory Cache</b><br>
    <div id="cache-info" class="cache-details">Checking local browser memory...</div>
    <button id="sync-cache-btn" class="btn-sync">🔄 Sync Memory Cache Now</button>
  </div>

  <div class="field-group">
    <label>API Key (Auto-synced on Google Login):</label>
    <input type="text" id="api-key-input" placeholder="mew_sk_user_...">
    <button id="save-key-btn" class="btn-secondary">Save Key Manually</button>
  </div>

  <button id="trigger-autofill-btn" class="btn-primary">✨ Autofill Current Page & PDF Resume</button>

  <script src="popup.js"></script>
</body>
</html>
