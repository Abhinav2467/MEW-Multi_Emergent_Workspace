services:
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
