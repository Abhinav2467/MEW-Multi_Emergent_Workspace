<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Take control of hiring — J-Vers replica</title>
<style>
  :root{
    --bg-primary:#0B0B0C;
    --text-primary:#F5F4F0;
    --text-muted:#8C8C8C;
    --accent:#D6D2C4;
    --overlay-scrim:rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg-primary); color:var(--text-primary);
    font-family:"Neue Montreal","General Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
    overflow-x:hidden;}
  a{color:inherit; text-decoration:none;}

  /* ---------- PRELOADER ---------- */
  #loader{
    position:fixed; inset:0; z-index:999; background:var(--bg-primary);
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding:32px; pointer-events:none;
  }
  #loader-percent{
    font-size:clamp(14px,1.4vw,18px); letter-spacing:.08em; color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  #curtain{
    position:fixed; inset:0; z-index:998; background:var(--bg-primary);
    transform-origin:bottom; transform:scaleY(1);
  }

  /* ---------- HEADER ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 40px; opacity:0; transform:translateY(-12px);
  }
  .logo{font-size:15px; font-weight:600; letter-spacing:.04em;}
  .nav-right{display:flex; align-items:center; gap:28px; font-size:14px; color:var(--text-muted);}
  .lang{display:flex; gap:8px;}
  .lang span{cursor:pointer;}
  .lang .active{color:var(--text-primary);}
  .menu-btn{color:var(--text-primary); cursor:pointer; letter-spacing:.05em;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative; min-height:100vh; display:flex; flex-direction:column;
    justify-content:center; padding:0 40px; overflow:hidden;
  }
  .hero video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(0.85) brightness(0.7); z-index:-2;
  }
  .hero::after{
    content:""; position:absolute; inset:0; background:var(--overlay-scrim); z-index:-1;
  }
  .eyebrow{
    opacity:0; transform:translateY(10px);
    font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);
    margin-bottom:24px;
  }
  h1{
    font-weight:500; letter-spacing:-0.02em; line-height:0.95;
    font-size:clamp(2.5rem,6vw,6rem); text-transform:uppercase;
  }
  .line-mask{overflow:hidden; display:block;}
  .line-mask span{display:block; transform:translateY(100%);}
  .sub{
    opacity:0; transform:translateY(16px);
    max-width:480px; margin-top:28px; font-size:17px; line-height:1.5; color:var(--text-muted);
  }
  .cta{
    opacity:0; transform:translateY(12px);
    display:inline-flex; align-items:center; gap:10px;
    margin-top:36px; width:fit-content;
    padding:16px 28px; border:1px solid var(--accent); border-radius:100px;
    font-size:14px; letter-spacing:.03em; position:relative; overflow:hidden;
  }
  .cta::before{
    content:""; position:absolute; inset:0; background:var(--accent);
    transform:scaleX(0); transform-origin:left; z-index:0; transition:transform .35s ease;
  }
  .cta span{position:relative; z-index:1; mix-blend-mode:difference;}
  .cta:hover::before{transform:scaleX(1);}
  .scroll-indicator{
    opacity:0; position:absolute; right:40px; bottom:40px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    font-size:12px; letter-spacing:.08em; color:var(--text-muted); text-transform:uppercase;
  }
  .scroll-indicator .dot{
    width:1px; height:36px; background:var(--text-muted); position:relative; overflow:hidden;
  }
  .scroll-indicator .dot::after{
    content:""; position:absolute; left:0; top:-100%; width:100%; height:100%;
    background:var(--text-primary); animation:scrollLine 1.6s ease-in-out infinite;
  }
  @keyframes scrollLine{
    0%{top:-100%;} 50%{top:0;} 100%{top:100%;}
  }

  @media (max-width:640px){
    header, .hero{padding-left:20px; padding-right:20px;}
    .scroll-indicator{right:20px; bottom:24px;}
  }

  @media (prefers-reduced-motion: reduce){
    #curtain, .line-mask span, .eyebrow, .sub, .cta, header, .scroll-indicator{
      transition:none !important; animation:none !important;
    }
  }
</style>
</head>
<body>

  <!-- PRELOADER -->
  <div id="curtain"></div>
  <div id="loader"><div id="loader-percent">00%</div></div>

  <!-- HEADER -->
  <header>
    <div class="logo">j-vers®</div>
    <div class="nav-right">
      <div class="lang"><span class="active">EN</span><span>DE</span></div>
      <div class="menu-btn">Menu</div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <video autoplay muted loop playsinline poster="">
      <source src="REPLACE_WITH_HERO_VIDEO.mp4" type="video/mp4" />
    </video>

    <p class="eyebrow">Programmatic job advertising agency backed by AI</p>

    <h1>
      <span class="line-mask"><span>Take control</span></span>
      <span class="line-mask"><span>of hiring</span></span>
    </h1>

    <p class="sub">
      No more wasted budgets. Get your job ads in front of the right
      people—at the right place, right time, and right price.
    </p>

    <a href="#form" class="cta"><span>Get started</span></a>

    <div class="scroll-indicator">
      <span>Scroll</span>
      <span class="dot"></span>
    </div>
  </section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const counterEl = document.getElementById('loader-percent');
  const curtain = document.getElementById('curtain');
  const loader = document.getElementById('loader');

  const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  if (reduce) {
    gsap.set([curtain, loader], { display: 'none' });
    gsap.set(['header', '.eyebrow', '.line-mask span', '.sub', '.cta', '.scroll-indicator'], { opacity: 1, y: 0, yPercent: 0 });
  } else {
    let counter = { val: 0 };
    tl.to(counter, {
      val: 100, duration: 1.8, ease: 'expo.out',
      onUpdate: () => counterEl.textContent = Math.round(counter.val).toString().padStart(2,'0') + '%'
    })
    .to(loader, { opacity: 0, duration: 0.3, onComplete: () => loader.style.display = 'none' })
    .to(curtain, { scaleY: 0, duration: 0.9, ease: 'power4.inOut' }, '-=0.1')
    .to('header', { opacity: 1, y: 0, duration: 0.6 }, '-=0.5')
    .to('.eyebrow', { opacity: 1, y: 0, duration: 0.6 }, '-=0.4')
    .to('.line-mask span', { yPercent: 0, stagger: 0.12, duration: 0.9, ease: 'power4.out' }, '-=0.3')
    .to('.sub', { opacity: 1, y: 0, duration: 0.6 }, '-=0.4')
    .to('.cta', { opacity: 1, y: 0, duration: 0.5 }, '-=0.3')
    .to('.scroll-indicator', { opacity: 1, duration: 0.5 }, '-=0.2');
  }
</script>
</body>
</html>
